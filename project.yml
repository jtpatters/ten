name: TenThousandYears
options:
  bundleIdPrefix: com.tenthousandyears
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Engine:
    path: Packages/Engine
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TenThousandYears:
    type: application
    platform: iOS
    sources:
      - path: App
        # Notes for people (AUTOMATION.md) are not app resources, and App/Tools (the script that
        # renders the app icon) is not app code.
        excludes: ["**/*.md", "Tools/**"]
    # A shared scheme, so `make sim` never depends on Xcode autocreating one.
    scheme: {}
    dependencies:
      - package: Engine
        products: [GameCore, MapGen, MapRendering, GameAI, Persistence]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenthousandyears.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "10,000 Years"
        # App/Assets.xcassets/AppIcon.appiconset, rendered by App/Tools/AppIcon/make-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # The HUD is parchment and ink in every appearance (docs/ART.md); in Dark Mode the
        # system's own controls (pickers, menus, alerts, sheets' fields) turned light-on-light.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        # The owner's Apple Developer team, for builds to a real iPhone or iPad (simulator builds
        # sign locally and ignore it). Xcode's Signing editor setting would be lost on the next
        # `xcodegen generate`, so it lives here.
        DEVELOPMENT_TEAM: GGVMNSURCF
        SWIFT_STRICT_CONCURRENCY: complete
